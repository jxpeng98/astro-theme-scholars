name: Template Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Open template update PR
    runs-on: ubuntu-latest
    if: github.repository != 'jxpeng98/astro-theme-scholars'

    steps:
      - name: Checkout downstream site
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TEMPLATE_UPDATE_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Check latest template release
        id: latest
        run: node scripts/template-latest-version.mjs

      - name: Sync template files
        if: steps.latest.outputs.update_available == 'true'
        env:
          TEMPLATE_TAG: ${{ steps.latest.outputs.latest_tag }}
        run: |
          upstream="$(node -p "JSON.parse(require('fs').readFileSync('.template-sync.json', 'utf8')).upstream")"
          git clone --depth 1 --branch "$TEMPLATE_TAG" "https://github.com/${upstream}.git" "$RUNNER_TEMP/template"
          node scripts/sync-template-release.mjs --source "$RUNNER_TEMP/template" --target "$GITHUB_WORKSPACE" --config ".template-sync.json"
          printf "%s\n" "${{ steps.latest.outputs.latest_version }}" > .template-version

      - name: Create or update pull request
        if: steps.latest.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_UPDATE_TOKEN || github.token }}
          TEMPLATE_TAG: ${{ steps.latest.outputs.latest_tag }}
          TEMPLATE_VERSION: ${{ steps.latest.outputs.latest_version }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No template changes to propose."
            exit 0
          fi

          branch="chore/template-update-${TEMPLATE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(template): bump to ${TEMPLATE_TAG}"
          git push --force-with-lease origin "$branch"

          body="$(printf 'Updates this site from astro-theme-scholars %s.\n\nProtected personal content paths from .template-sync.json were left untouched.\nReview the diff before merging, especially if local template files were customized.' "$TEMPLATE_TAG")"

          existing_pr="$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "chore(template): bump to ${TEMPLATE_TAG}" --body "$body"
          else
            gh pr create --head "$branch" --title "chore(template): bump to ${TEMPLATE_TAG}" --body "$body"
          fi

      - name: Report no update
        if: steps.latest.outputs.update_available != 'true'
        run: echo "Template is already up to date."
