name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'jxpeng98/astro-theme-scholars'
    name: Verify and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release versions
        run: node scripts/check-release.mjs --tag "${{ github.ref_name }}"

      - name: Verify site
        run: pnpm verify

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify browser interactions
        run: pnpm test:browser

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag

      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
